<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Noxa Detail | Car Care</title>

<link rel="icon" type="image/png" href="favicon.png">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Montserrat', sans-serif;
}

html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
}

body {
    background: radial-gradient(circle at top, #111 0%, #000 80%);
    color: white;
    min-height: 100svh;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    z-index: 2;
    animation: fadeIn 1.5s ease forwards;
    opacity: 0;
}


  .logo img {
      width: 720px;
      max-width: 98%;
      height: auto;
      filter: drop-shadow(0 0 40px rgba(212,175,55,0.8));
      animation: logoFade 1.8s ease forwards;
      opacity: 0;
  }

  .bio {
      margin: -20px auto 40px auto;
      max-width: 500px;
      padding: 0 20px;
      text-align: center;
  }

  .bio-title {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 10px;
  }

  .bio-text {
      font-size: 0.95rem;
      font-weight: 300;
      color: #ccc;
      line-height: 1.6;
  }

  @keyframes logoFade {
      to {
          opacity: 1;
      }
  }

.subtitle {
    font-weight: 300;
    font-size: 1rem;
    letter-spacing: 4px;
    margin-bottom: 70px;
    color: #aaa;
}

.socials {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
}

.social-btn {
    padding: 15px 40px;
    border: 1.5px solid #272b35;
    background: rgba(17, 19, 24, 0.6);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    color: #f3f5f7;
    text-decoration: none;
    font-weight: 600;
    letter-spacing: 2px;
    transition: border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 320px;
    text-align: center;
    overflow: hidden;
    border-radius: 8px;
    isolation: isolate;
}

.social-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(212,180,108,0.4), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
    z-index: -1;
}

.social-btn:hover::before {
    left: 125%;
}

.social-btn:hover {
    border-color: #d4b46c;
    color: #d4b46c;
    box-shadow: 0 0 24px rgba(212,180,108,0.35);
    transform: translateY(-3px);
}

.login-link {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 5;
    color: #d4b46c;
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    padding: 9px 18px;
    border: 1.5px solid rgba(212,180,108,0.4);
    border-radius: 6px;
    background: rgba(17,19,24,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.3s ease;
}

.login-link:hover {
    background: #d4b46c;
    color: #0a0c0f;
    border-color: #d4b46c;
    box-shadow: 0 0 20px rgba(212,180,108,0.45);
}

@media (max-width: 600px) {
    .login-link {
        top: 16px;
        right: 16px;
        padding: 7px 14px;
        font-size: 0.7rem;
    }
}

@media (max-width: 600px) {
    .container {
        width: 100%;
        padding: 0 20px;
    }

    .social-btn {
        max-width: 100%;
        width: 100%;
    }
}

@keyframes fadeIn {
    to {
        opacity: 1;
    }
}

/* Particles */
canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<a href="https://app.noxadetail.com" class="login-link">INICIAR SESIÓN</a>

<div class="container">
    <div class="logo"><img src="logo.png" alt="Noxa Detail Logo"></div>
    <div class="bio">
       <div class="bio-text">
            Detailing & Premium Car Care <br>
            Corrección de pintura • Cerámicos • Interior profundo <br>
            📍 Bogotá, Colombia
        </div>
    </div>

    <div class="socials">
        <a href="catalogo.pdf" target="_blank" class="social-btn">CATÁLOGO</a>
        <a href="https://instagram.com/noxa.detail" target="_blank" class="social-btn">INSTAGRAM</a>
        <a href="https://tiktok.com/@noxa.detail" target="_blank" class="social-btn">TIKTOK</a>
        <a href="https://wa.me/573027928250" target="_blank" class="social-btn">WHATSAPP</a>
    </div>
</div>

<script>
// Particles background
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];

class Particle {
    constructor(){
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;

        // Tamaños variados (más naturales)
        this.size = Math.random() * 3 + 0.5;

        // Velocidad variada
        this.speedY = Math.random() * 0.7 + 0.2;

        // 70% blancos, 30% dorados
        const isGold = Math.random() < 0.3;

        if (isGold) {
            this.color = "rgba(255,255,255," + (Math.random() * 0.6 + 0.3) + ")";
        } else {
            this.color = "rgba(255,255,255," + (Math.random() * 0.6 + 0.2) + ")";
        }
    }

    update(){
        this.y += this.speedY;

        if(this.y > canvas.height){
            this.y = 0;
            this.x = Math.random() * canvas.width;
        }
    }

    draw(){
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
    }
}

function init(){
    for(let i = 0; i < 60; i++){
        particlesArray.push(new Particle());
    }
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particlesArray.forEach(p => {
        p.update();
        p.draw();
    });
    requestAnimationFrame(animate);
}

init();
animate();

window.addEventListener('resize', function(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
