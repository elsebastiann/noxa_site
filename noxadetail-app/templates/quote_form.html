{% extends "base.html" %}
{% block extra_head %}
<style>
  .cot-wrap { display:grid; grid-template-columns: 1fr 420px; gap:20px; align-items:start; }
  @media (max-width: 1100px) { .cot-wrap { grid-template-columns:1fr; } }

  .cot-panel { background:var(--bg2,#1b1b1b); border:1px solid rgba(255,255,255,.09);
               border-radius:12px; padding:16px; }
  .cot-resumen { position:sticky; top:16px; }

  .cat-titulo { font-size:.72rem; letter-spacing:.09em; text-transform:uppercase;
                color:var(--accent,#c8a04a); margin:16px 0 8px; font-weight:700; }
  .cat-titulo:first-child { margin-top:0; }

  .svc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:8px; }
  .svc-btn { text-align:left; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.10);
             border-radius:9px; padding:9px 11px; cursor:pointer; transition:.12s;
             display:flex; justify-content:space-between; gap:10px; align-items:center; width:100%; }
  .svc-btn:hover { border-color:var(--accent,#c8a04a); background:rgba(200,160,74,.10); }
  .svc-btn.puesto { border-color:var(--accent,#c8a04a); background:rgba(200,160,74,.16); }
  .svc-btn .n { font-size:.88rem; color:#e9e9e9; line-height:1.25; }
  .svc-btn .p { font-size:.86rem; color:var(--accent,#c8a04a); font-weight:700; white-space:nowrap; }

  .linea { display:grid; grid-template-columns:1fr 52px 104px 30px; gap:6px;
           align-items:center; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  .linea input { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.10);
                 color:#eee; border-radius:6px; padding:5px 7px; font-size:.85rem; width:100%; }
  .linea .quitar { background:none; border:none; color:#e07a7a; cursor:pointer; font-size:1.05rem; line-height:1; }

  .tot-fila { display:flex; justify-content:space-between; padding:5px 0; font-size:.9rem; color:#bdbdbd; }
  .tot-fila.grande { font-size:1.32rem; font-weight:700; color:#fff; border-top:1px solid rgba(255,255,255,.14);
                     margin-top:8px; padding-top:11px; }
  .vacio { color:#8a8a8a; font-size:.87rem; text-align:center; padding:22px 8px; }
  .aviso-precio { font-size:.79rem; color:#ffd9a0; background:rgba(200,140,40,.14);
                  border:1px solid rgba(200,140,40,.4); border-radius:7px; padding:7px 9px; margin-top:9px; }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid px-3 px-lg-4 mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="mb-0">Nueva cotización</h2>
    <a href="{{ url_for('quotes_list') }}" class="btn btn-outline-secondary btn-sm">Ver cotizaciones</a>
  </div>

  <form method="POST" id="formCot">
  <div class="cot-wrap">

    <!-- ================= IZQUIERDA: cliente + catálogo ================= -->
    <div>
      <div class="cot-panel mb-3">
        <div class="row g-2">
          <div class="col-12 col-md-4">
            <label class="form-label small text-muted mb-1">Cliente *</label>
            <input type="text" name="customer_name" class="form-control" required autofocus>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label small text-muted mb-1">Teléfono</label>
            <input type="text" name="customer_phone" class="form-control">
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small text-muted mb-1">Placa</label>
            <input type="text" name="plate" class="form-control text-uppercase">
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label small text-muted mb-1">Vehículo</label>
            <input type="text" name="vehicle_label" class="form-control" placeholder="Mazda 3 2021">
          </div>
        </div>
      </div>

      <div class="cot-panel">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
          <strong class="small">Servicios del catálogo</strong>
          <div class="d-flex align-items-center gap-2">
            <label class="small text-muted mb-0">Tipo de vehículo</label>
            <select name="vehicle_type_id" id="tipoVeh" class="form-select form-select-sm" style="width:auto">
              {% for t in tipos %}
              <option value="{{ t.id }}">{{ t.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div id="avisoRepricing"></div>
        <div id="catalogo"></div>
      </div>
    </div>

    <!-- ================= DERECHA: la cotización ================= -->
    <div class="cot-panel cot-resumen">
      <strong class="small d-block mb-2">Cotización</strong>

      <div id="lineas"></div>
      <div id="vacio" class="vacio">Toca un servicio para agregarlo.</div>

      <button type="button" id="btnLibre" class="btn btn-outline-secondary btn-sm w-100 mt-2">
        + Servicio que no está en sistema
      </button>

      <hr class="my-3" style="border-color:rgba(255,255,255,.12)">

      <label class="form-label small text-muted mb-1">Descuento (opcional)</label>
      <div class="row g-1 mb-2">
        <div class="col-5">
          <select name="discount_type" id="dtipo" class="form-select form-select-sm">
            <option value="">Sin descuento</option>
            <option value="percentage">Porcentaje</option>
            <option value="absolute">Monto fijo</option>
          </select>
        </div>
        <div class="col-3">
          <input type="number" name="discount_value" id="dvalor" class="form-control form-control-sm"
                 min="0" value="0" disabled>
        </div>
        <div class="col-4">
          <input type="text" name="discount_label" id="detiqueta" class="form-control form-control-sm"
                 placeholder="Motivo" disabled>
        </div>
      </div>

      <div class="tot-fila"><span>Subtotal</span><span id="tSub">$0</span></div>
      <div class="tot-fila" id="filaDesc" style="display:none">
        <span id="tDescLbl">Descuento</span><span id="tDesc">$0</span>
      </div>
      <div class="tot-fila grande"><span>Total</span><span id="tTot">$0</span></div>

      <label class="form-label small text-muted mb-1 mt-3">Observaciones</label>
      <textarea name="notes" class="form-control form-control-sm" rows="2"></textarea>

      <div class="d-flex align-items-center gap-2 mt-2">
        <label class="small text-muted mb-0">Válida por</label>
        <input type="number" name="valid_days" class="form-control form-control-sm"
               style="width:70px" min="1" value="{{ dias_por_defecto }}">
        <span class="small text-muted">días</span>
      </div>

      <button type="submit" class="btn btn-warning w-100 mt-3 fw-bold" id="btnGuardar" disabled>
        Generar cotización y PDF
      </button>
    </div>
  </div>
  </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const CATALOGO = {{ catalogo|tojson }};
const fmt = n => "$" + (Math.round(n)||0).toLocaleString("es-CO");

// Cada línea: {desc, precio, cant, serviceId|null}. serviceId null = servicio
// suelto escrito a mano, que no se re-tarifa al cambiar el tipo de vehículo.
let lineas = [];

const $cat = document.getElementById("catalogo");
const $lineas = document.getElementById("lineas");
const $tipo = document.getElementById("tipoVeh");

function serviciosDelTipo() {
  return CATALOGO[$tipo.value] || [];
}

function pintarCatalogo() {
  const svcs = serviciosDelTipo();
  if (!svcs.length) {
    $cat.innerHTML = '<div class="vacio">Este tipo de vehículo no tiene precios cargados.</div>';
    return;
  }
  const puestos = new Set(lineas.filter(l => l.serviceId).map(l => l.serviceId));
  let html = "", catActual = null;
  for (const s of svcs) {
    if (s.categoria !== catActual) {
      if (catActual !== null) html += "</div>";
      html += `<div class="cat-titulo">${s.categoria}</div><div class="svc-grid">`;
      catActual = s.categoria;
    }
    html += `<button type="button" class="svc-btn ${puestos.has(s.id) ? "puesto" : ""}"
               data-id="${s.id}" data-precio="${s.precio}">
               <span class="n">${s.nombre}</span><span class="p">${fmt(s.precio)}</span></button>`;
  }
  html += "</div>";
  $cat.innerHTML = html;
  $cat.querySelectorAll(".svc-btn").forEach(b => b.onclick = () => {
    const id = Number(b.dataset.id);
    const ya = lineas.find(l => l.serviceId === id);
    if (ya) { ya.cant += 1; }
    else {
      const s = serviciosDelTipo().find(x => x.id === id);
      lineas.push({desc: s.nombre, precio: s.precio, cant: 1, serviceId: id});
    }
    pintarTodo();
  });
}

function pintarLineas() {
  document.getElementById("vacio").style.display = lineas.length ? "none" : "block";
  document.getElementById("btnGuardar").disabled = !lineas.length;
  $lineas.innerHTML = lineas.map((l, i) => `
    <div class="linea">
      <input type="text" name="item_desc" value="${l.desc.replace(/"/g, "&quot;")}" data-i="${i}" data-c="desc">
      <input type="number" name="item_qty" value="${l.cant}" min="1" data-i="${i}" data-c="cant">
      <input type="number" name="item_price" value="${l.precio}" min="0" data-i="${i}" data-c="precio">
      <button type="button" class="quitar" data-i="${i}" title="Quitar">&times;</button>
      <input type="hidden" name="item_service_id" value="${l.serviceId ?? ""}">
    </div>`).join("");

  $lineas.querySelectorAll("input[data-c]").forEach(inp => {
    inp.oninput = () => {
      const l = lineas[inp.dataset.i], c = inp.dataset.c;
      l[c] = (c === "desc") ? inp.value : Math.max(c === "cant" ? 1 : 0, Number(inp.value) || 0);
      pintarTotales();
    };
  });
  $lineas.querySelectorAll(".quitar").forEach(b => b.onclick = () => {
    lineas.splice(Number(b.dataset.i), 1); pintarTodo();
  });
}

function pintarTotales() {
  const sub = lineas.reduce((a, l) => a + l.precio * l.cant, 0);
  const tipo = document.getElementById("dtipo").value;
  const val = Number(document.getElementById("dvalor").value) || 0;
  let desc = 0;
  if (tipo === "percentage") desc = Math.round(sub * Math.min(100, Math.max(0, val)) / 100);
  else if (tipo === "absolute") desc = Math.min(val, sub);   // nunca un total negativo

  document.getElementById("tSub").textContent = fmt(sub);
  document.getElementById("filaDesc").style.display = desc ? "flex" : "none";
  document.getElementById("tDesc").textContent = "− " + fmt(desc);
  document.getElementById("tDescLbl").textContent =
    (document.getElementById("detiqueta").value || "Descuento") +
    (tipo === "percentage" ? ` (${val}%)` : "");
  document.getElementById("tTot").textContent = fmt(sub - desc);
}

function pintarTodo() { pintarCatalogo(); pintarLineas(); pintarTotales(); }

// Cambiar el tipo de vehículo re-tarifa lo que ya está puesto. Es el punto del
// módulo: los mismos servicios valen distinto según el carro, y dejar precios
// de camioneta en una cotización de moto sería un error caro y silencioso.
$tipo.onchange = () => {
  const svcs = serviciosDelTipo();
  let cambiados = 0, huerfanos = 0;
  for (const l of lineas) {
    if (!l.serviceId) continue;
    const s = svcs.find(x => x.id === l.serviceId);
    if (!s) { huerfanos++; continue; }
    if (s.precio !== l.precio) { l.precio = s.precio; cambiados++; }
  }
  const av = document.getElementById("avisoRepricing");
  const partes = [];
  if (cambiados) partes.push(`Se actualizaron ${cambiados} precio(s) al nuevo tipo de vehículo.`);
  if (huerfanos) partes.push(`${huerfanos} servicio(s) no tienen precio para este tipo — revísalos.`);
  av.innerHTML = partes.length ? `<div class="aviso-precio">${partes.join(" ")}</div>` : "";
  pintarTodo();
};

document.getElementById("btnLibre").onclick = () => {
  lineas.push({desc: "", precio: 0, cant: 1, serviceId: null});
  pintarLineas(); pintarTotales();
  const ins = $lineas.querySelectorAll('input[data-c="desc"]');
  if (ins.length) ins[ins.length - 1].focus();
};

["dtipo", "dvalor", "detiqueta"].forEach(id =>
  document.getElementById(id).addEventListener("input", pintarTotales));
document.getElementById("dtipo").addEventListener("change", () => {
  const hay = !!document.getElementById("dtipo").value;
  document.getElementById("dvalor").disabled = !hay;
  document.getElementById("detiqueta").disabled = !hay;
  pintarTotales();
});

pintarTodo();
</script>
{% endblock %}
