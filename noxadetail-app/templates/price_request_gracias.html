<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracias — NOXA Detail</title>
<style>
  body { margin:0; background:#f4f2ee; color:#1a1a1a; display:flex; min-height:100vh;
         align-items:center; justify-content:center; padding:24px;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .caja { background:#fff; border-radius:14px; padding:36px 30px; max-width:440px;
          text-align:center; border-top:3px solid #c8a04a; }
  .marca { font-size:1.3rem; font-weight:800; letter-spacing:.06em; margin-bottom:22px; }
  .marca small { display:block; font-size:.56rem; letter-spacing:.34em; color:#6b6b6b;
                 font-weight:600; margin-top:2px; }
  h1 { font-size:1.25rem; margin:0 0 10px; }
  p { color:#6b6b6b; font-size:.92rem; line-height:1.55; margin:0 0 16px; }
  a { color:#a6812f; font-weight:700; text-decoration:none; }
</style>
</head>
<body>
  <div class="caja">
    <div class="marca">NØXA<small>CAR CARE</small></div>
    <h1>Listo, ya nos llegaron</h1>
    <p>
      Gracias por los precios del {{ s.vehiculo }}. Los tenemos acá y con eso armamos
      la cotización del cliente.
    </p>
    <p>
      Si te equivocaste en algo, todavía puedes
      <a href="{{ url_for('price_request_public', token=s.public_token) }}">volver a la lista</a>
      y corregirlo — el link vive hasta el {{ s.expires_on.strftime('%d/%m/%Y') }}.
    </p>
  </div>
</body>
</html>
